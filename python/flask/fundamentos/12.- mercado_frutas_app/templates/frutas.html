<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Frutas - Mercado</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
                <i class="bi bi-apple"></i> Mercado de Frutas
            </a>
            <div>
                <a class="nav-link text-white d-inline me-3" href="{{ url_for('index') }}">Inicio</a>
                <a class="nav-link text-white d-inline active fw-bold" href="{{ url_for('catalogo') }}">Catálogo</a>
            </div>
        </div>
    </nav>

    <!-- Encabezado de la página -->
    <header class="hero text-center text-white">
        <div class="container">
            <h1>Nuestro Catálogo Histórico</h1>
            <p>Conoce la frescura y propiedades de todos nuestros productos disponibles.</p>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="container my-5">
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            {% for fruta in frutas %}
            <div class="col">
                <div class="card fruta-card h-100 shadow-sm">
                    <img src="{{ url_for('static', filename='images/' + fruta.imagen) }}" class="card-img-top" alt="{{ fruta.nombre }}">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 class="card-title mb-0 fw-bold">{{ fruta.nombre }}</h5>
                            <span class="badge bg-success fs-6">${{ fruta.precio }} / ud</span>
                        </div>
                        <p class="card-text text-muted flex-grow-1">{{ fruta.descripcion }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <div class="text-center mt-5">
            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
                <i class="bi bi-cart-plus-fill me-2"></i>Ir a realizar un pedido
            </a>
        </div>
    </main>

</body>
</html>
